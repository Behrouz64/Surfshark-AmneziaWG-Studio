[project]
name = "surfshark-amneziawg-studio"
version = "1.0.0"
description = "Find working Surfshark servers and build AmneziaWG configs and wg:// links on your phone."
requires-python = ">=3.10"
dependencies = [
    "flet==0.28.3",
    "httpx>=0.27",
    "qrcode>=7.4.2",
]

[tool.flet]
product = "Surfshark AmneziaWG Studio"
# Change org to your own reverse-domain name before publishing. It becomes part of the bundle ID.
org = "com.example"
